<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#5b5bf0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Logs">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <title>Log Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #f4f5fb;
      --card: #fff;
      --tx: #161a2b;
      --mu: #6b7285;
      --bd: #e7e9f2;
      --ac: #5b5bf0;
      --acs: #eceefe;
      --rd: #e5484d;
      --rds: #fdecec;
      --gn: #18a058;
      --gns: #e6f6ee;
      --sh: 0 1px 2px rgba(20, 24, 50, .05), 0 6px 20px rgba(20, 24, 50, .05)
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --bg: #0d0f17;
        --card: #161924;
        --tx: #eceef6;
        --mu: #9097ad;
        --bd: #252a3a;
        --ac: #8b8bff;
        --acs: #23264a;
        --rd: #ff6b70;
        --rds: #3a1d21;
        --gn: #4cd18a;
        --gns: #16301f;
        --sh: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25)
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.55 "Inter", system-ui, sans-serif
    }

    i {
      flex-shrink: 0
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--bd)
    }

    .hin {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 17px
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--ac);
      color: #fff;
      display: grid;
      place-items: center
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--gn);
      font-weight: 500
    }

    .live::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gn);
      box-shadow: 0 0 0 3px var(--gns)
    }

    .tabs {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      padding: 14px 16px 6px;
      overflow-x: auto;
      scrollbar-width: none
    }

    .tabs::-webkit-scrollbar {
      display: none
    }

    .tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 500;
      box-shadow: var(--sh)
    }

    .tab .n {
      background: var(--bg);
      color: var(--mu);
      font-size: 12px;
      padding: 0 8px;
      border-radius: 99px
    }

    .tab.on {
      background: var(--ac);
      border-color: var(--ac);
      color: #fff
    }

    .tab.on .n {
      background: rgba(255, 255, 255, .22);
      color: #fff
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 10px 16px 48px
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--sh);
      display: flex;
      align-items: center;
      gap: 12px
    }

    .stat .si {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--acs);
      color: var(--ac);
      display: grid;
      place-items: center
    }

    .stat b {
      display: block;
      font-size: 19px;
      line-height: 1.2
    }

    .mu {
      color: var(--mu);
      font-size: 13px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--sh)
    }

    .dev {
      display: flex;
      gap: 14px;
      align-items: center;
      cursor: pointer;
      transition: transform .12s, border-color .12s
    }

    .dev:hover {
      transform: translateY(-1px);
      border-color: var(--ac)
    }

    .av {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--acs);
      color: var(--ac);
      display: grid;
      place-items: center;
      font-size: 20px
    }

    .av.bad {
      background: var(--rds);
      color: var(--rd)
    }

    .info {
      flex: 1;
      min-width: 0
    }

    .top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .top b {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      color: var(--mu);
      font-size: 13px
    }

    .meta span {
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    .meta i {
      width: 14px;
      text-align: center;
      font-size: 12px
    }

    .chips {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--acs);
      color: var(--ac);
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 500
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--rds);
      color: var(--rd);
      padding: 1px 9px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600
    }

    .badge.ok {
      background: var(--gns);
      color: var(--gn)
    }

    .badge.nw {
      background: var(--acs);
      color: var(--ac)
    }

    .chev {
      color: var(--mu);
      font-size: 13px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 500
    }

    .btn:hover {
      border-color: var(--ac)
    }

    .btn.pri {
      background: var(--ac);
      border-color: var(--ac);
      color: #fff
    }

    .btn.red {
      color: var(--rd);
      background: var(--rds);
      border-color: transparent
    }

    .btn.grn {
      color: var(--gn);
      background: var(--gns);
      border-color: transparent
    }

    .btn.sm {
      padding: 5px 10px;
      font-size: 13px
    }

    .acts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px
    }

    .back {
      margin-bottom: 12px
    }

    .prof {
      display: flex;
      gap: 14px;
      align-items: flex-start
    }

    .prof .av {
      width: 56px;
      height: 56px;
      font-size: 24px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 14px
    }

    .grid div {
      background: var(--bg);
      border-radius: 12px;
      padding: 10px 12px
    }

    .grid .mu {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px
    }

    .grid b {
      font-size: 14px;
      font-weight: 600;
      word-break: break-word
    }

    .sec {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 2px 10px;
      font-size: 16px
    }

    .tl {
      position: relative;
      padding-left: 22px
    }

    .tl::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--bd)
    }

    .log {
      position: relative
    }

    .log::before {
      content: "";
      position: absolute;
      left: -21px;
      top: 20px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ac);
      box-shadow: 0 0 0 4px var(--acs)
    }

    .log .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .log .pg {
      word-break: break-all;
      margin-top: 2px
    }

    .trashed {
      opacity: .6
    }

    .empty {
      text-align: center;
      color: var(--mu);
      padding: 48px 16px
    }

    .empty i {
      font-size: 36px;
      margin-bottom: 12px;
      opacity: .5;
      display: block
    }

    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px
    }

    .lcard {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 22px;
      padding: 28px 24px;
      box-shadow: var(--sh);
      text-align: center
    }

    .lic {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: var(--acs);
      color: var(--ac);
      display: grid;
      place-items: center;
      font-size: 24px;
      margin: 0 auto 14px
    }

    .lcard h2 {
      margin: 0 0 2px
    }

    .field {
      position: relative;
      margin: 18px 0 6px
    }

    .field i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mu)
    }

    .field input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 1px solid var(--bd);
      border-radius: 12px;
      background: var(--bg);
      color: var(--tx);
      font: inherit;
      outline: none
    }

    .field input:focus {
      border-color: var(--ac);
      box-shadow: 0 0 0 3px var(--acs)
    }

    .err {
      color: var(--rd);
      font-size: 13px;
      min-height: 22px;
      margin-bottom: 6px
    }

    .lcard .btn {
      width: 100%;
      padding: 12px
    }

    @media(max-width:520px) {
      .stats {
        grid-template-columns: 1fr
      }

      .stat {
        padding: 10px 14px
      }
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(10, 12, 24, .55);
      backdrop-filter: blur(3px);
      display: grid;
      place-items: center;
      padding: 16px
    }

    .mbox {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--sh)
    }

    .mbox h3 {
      margin: 0;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gn);
      display: inline-block;
      animation: pl 1.4s infinite
    }

    @keyframes pl {
      50% {
        opacity: .3
      }
    }

    @media(max-width:520px) {
      .tabs {
        padding: 14px 10px 6px;
        gap: 6px
      }

      .tab {
        flex: 1;
        justify-content: center;
        padding: 8px 6px;
        gap: 5px;
        font-size: 13px
      }

      .tab i {
        display: none
      }

      .tab .n {
        padding: 0 6px
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, getDoc, setDoc, addDoc, getDocs, updateDoc, limit, writeBatch, deleteField, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const app = initializeApp({
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    });
    let PASS = 0, PW = "", MODE = "", bsub = "device", tSite = "";
    const db = getFirestore(app);
    const auth = getAuth(app);
    const $ = document.getElementById("app");
    let devices = [], bans = {}, attempts = [], tab = "", curSite = "", open = null, logs = [], unsubs = [], unLogs = null;

    const SESSION_MIN = 2, SK = "_lg_dash", LOCK_DAYS = 24;
    let expAt = 0, lastTouch = 0, busy = false;
    function numOf(str) {
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0, c; i < str.length; i++) { c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677) }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)) % 9000 + 1000
    }
    const saveSess = () => { expAt = Date.now() + SESSION_MIN * 60000; try { localStorage.setItem(SK, JSON.stringify({ m: MODE, exp: expAt })) } catch (e) { } };
    const clearSess = () => { try { localStorage.removeItem(SK) } catch (e) { } };
    const loadSess = () => { try { const x = JSON.parse(localStorage.getItem(SK) || "null"); return x && x.exp > Date.now() ? x : null } catch (e) { return null } };
    const touch = () => { if (!MODE) return; const n = Date.now(); if (n - lastTouch > 5000) { lastTouch = n; saveSess() } };
    ["click", "keydown", "touchstart", "scroll", "mousemove"].forEach(ev => addEventListener(ev, touch, { passive: true }));
    setInterval(() => { if (MODE && Date.now() > expAt) lockOut("Session expired. Please sign in again.") }, 10000);
    const nm = d => d.alias || d.device || d.ua || "Unknown device";
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    function askName(cur) {
      return new Promise(res => {
        const m = document.createElement("div"); m.className = "modal";
        m.innerHTML = `<div class="mbox"><h3><i class="fa-solid fa-pen"></i> Rename device</h3>
  <div class="field" style="margin:14px 0 8px"><i class="fa-solid fa-tag"></i><input id="rn" maxlength="40" placeholder="e.g. My iPhone" value="${esc(cur)}"></div>
  <div class="mu" style="margin-bottom:14px">Leave empty to go back to the original name.</div>
  <div class="acts" style="justify-content:flex-end;margin:0"><button class="btn" id="rc">Cancel</button><button class="btn pri" id="rs">Save</button></div></div>`;
        document.body.appendChild(m);
        const i = m.querySelector("#rn"); i.focus(); i.select();
        const end = v => { m.remove(); res(v) };
        m.querySelector("#rs").onclick = () => end(i.value);
        m.querySelector("#rc").onclick = () => end(null);
        m.onclick = e => { if (e.target === m) end(null) };
        i.onkeydown = e => { if (e.key === "Enter") end(i.value); if (e.key === "Escape") end(null) };
      })
    }

    function askBan(title) {
      return new Promise(res => {
        const m = document.createElement("div"); m.className = "modal";
        m.innerHTML = `<div class="mbox"><h3><i class="fa-solid fa-ban"></i> ${esc(title)}</h3>
  <textarea id="bm" maxlength="200" placeholder="Message to show (optional)" style="width:100%;height:90px;margin:14px 0 8px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;resize:none;outline:none"></textarea>
  <div class="mu" style="margin-bottom:14px">Leave empty to show the default message.</div>
  <div class="acts" style="justify-content:flex-end;margin:0"><button class="btn" id="bc">Cancel</button><button class="btn red" id="bs">Ban</button></div></div>`;
        document.body.appendChild(m);
        const t = m.querySelector("#bm"); t.focus();
        const end = v => { m.remove(); res(v) };
        m.querySelector("#bs").onclick = () => end(t.value);
        m.querySelector("#bc").onclick = () => end(null);
        m.onclick = e => { if (e.target === m) end(null) };
        t.onkeydown = e => { if (e.key === "Escape") end(null) };
      })
    }

    const T = t => t?.toDate ? t.toDate() : (t ? new Date(t) : null);
    const fd = t => { const d = T(t); return d ? d.toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) : "—" };
    const dur = s => { s = Math.round(s || 0); if (s < 60) return s + " sec"; const m = Math.floor(s / 60); return m < 60 ? m + "m " + (s % 60) + "s" : Math.floor(m / 60) + "h " + (m % 60) + "m" };
    const ipKey = ip => "ip_" + String(ip).replace(/[.:]/g, "_");
    const isBanned = d => !!(bans[d.id] || (d.ip && bans[ipKey(d.ip)]));
    const ic = n => `<i class="fa-solid fa-${n}"></i>`;
    const dIcon = d => { const u = ((d.device || "") + " " + (d.ua || "")).toLowerCase(); return /ipad|tablet/.test(u) ? "tablet-screen-button" : /mobile|android|iphone/.test(u) ? "mobile-screen" : "desktop" };
    const loc = d => [d.city, d.country].filter(Boolean).join(", ") || "—";
    const ONLINE_MS = 70000;
    const isOn = d => { const t = T(d.lastSeen); return !!t && Date.now() - t.getTime() < ONLINE_MS };
    const ago = t => {
      const d = T(t); if (!d) return "—"; const s = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
      if (s < 60) return s + " sec ago"; const m = Math.floor(s / 60); if (m < 60) return m + " min ago";
      const h = Math.floor(m / 60); if (h < 24) return h + "h " + (m % 60) + "m ago"; const dd = Math.floor(h / 24); return dd + " day" + (dd > 1 ? "s" : "") + " ago"
    };
    const stat = d => isOn(d) ? `<span class="badge ok"><span class="pulse"></span>Online now</span>` : `<span class="mu" style="font-size:12px">Last online ${ago(d.lastSeen)}</span>`;
    const isNew = d => { const t = T(d.firstSeen); return !d.seen && !d.trashed && !!t && Date.now() - t.getTime() < 7 * 864e5 };
    async function markSeen(id) {
      const d = devices.find(x => x.id === id); if (!d || d.seen) return;
      const b = writeBatch(db); b.update(doc(db, "devices", id), { seen: true });
      try { await b.commit() } catch (e) { console.error(e) }
    }

    /* ---------- install app ---------- */
    let dip = null;
    const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    addEventListener("beforeinstallprompt", e => { e.preventDefault(); dip = e });
    addEventListener("appinstalled", () => { dip = null; if (MODE) render() });
    function installHelp() {
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const m = document.createElement("div"); m.className = "modal";
      m.innerHTML = `<div class="mbox"><h3>${ic("download")} Install app</h3>
  <div class="mu" style="margin:14px 0 8px">${ios ? "Tap the Share button in Safari, then choose <b>Add to Home Screen</b>." : "Open the browser menu (&#8942;) and choose <b>Install app</b> or <b>Add to Home screen</b>."}</div>
  <div class="mu" style="margin-bottom:14px">Open the site directly in Chrome or Safari, not inside another app.</div>
  <div id="chk" class="mu" style="margin-bottom:14px;line-height:1.9">Checking...</div>
  <div class="acts" style="justify-content:flex-end;margin:0"><button class="btn pri" id="ok">OK</button></div></div>`;
      document.body.appendChild(m);
      const end = () => m.remove();
      m.querySelector("#ok").onclick = end;
      m.onclick = e => { if (e.target === m) end() };
      (async () => {
        const rows = [], add = (ok, t) => rows.push((ok ? "&#9989; " : "&#10060; ") + t);
        add(isSecureContext, "HTTPS");
        let mf = null;
        try { const r = await fetch("manifest.webmanifest", { cache: "no-store" }); add(r.ok, "manifest.webmanifest"); if (r.ok) mf = await r.json() } catch (e) { add(false, "manifest.webmanifest") }

        if (d && isBanned(d)) return; if (!confirm("This will be deleted permanently. Are you sure?")) return;
        const s = await getDocs(query(collection(db, "devices", id, "logs"), limit(PASS)));
        for (let i = 0; i < s.docs.length; i += 9) { const c = s.docs.slice(i, i + 9); await W(b => c.forEach(x => b.delete(x.ref))) }
        await W(b => b.delete(doc(db, "devices", id)))
      }
      else if (a === "adel") await W(b => b.delete(doc(db, "attempts", id)));
      else if (a === "ltrash") await W(b => b.update(lref(), { trashed: true, trashedAt: serverTimestamp() }));
      else if (a === "lrestore") await W(b => b.update(lref(), { trashed: false }));
      else if (a === "lpurge") { if (confirm("This will be deleted permanently. Are you sure?")) await W(b => b.delete(lref())) }
    });

    setInterval(() => { if (MODE && !document.querySelector(".modal")) render() }, 15000);
    if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => { }));
    const sp = loadSess();
    $.innerHTML = `<div class="empty">${ic("spinner fa-spin")}Loading...</div>`;
    if (sp) {
      auth.authStateReady().then(() => { if (auth.currentUser) { MODE = sp.m || "auth"; PASS = 1000; start() } else loginView() });
    } else { signOut(auth).catch(() => { }); loginView() }
  </script>
